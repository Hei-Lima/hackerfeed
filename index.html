<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"="width=device-width, initial-scale=1.0">
    <title>Hackerfeed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="page/media/favico.ico" type="image/x-icon">
    <link href="page/css/output.css" rel="stylesheet">
    <script src="page/js/index.js"></script>
    <!-- FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body class="bg-base-200 font-display flex flex-col min-h-screen">
    
    <!-- Navbar -->
    <nav class="navbar bg-base-200 px-6">
        <div class="flex-1">
            <a href="https://hackernews.com" class="btn btn-ghost text-3xl text-primary">hackerfeed</a>
        </div>
        <div class="flex-none">
            <div class="dropdown dropdown-end">
                <div tabindex="0" role="button" class="btn m-1">
                  <span>Theme</span>
                  <svg
                    width="12px"
                    height="12px"
                    class="inline-block h-2 w-2 fill-current opacity-60"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 2048 2048">
                    <path d="M1799 349l242 241-1017 1017L7 590l242-241 775 775 775-775z"></path>
                  </svg>
                </div>
                <ul tabindex="0" class="dropdown-content menu bg-base-200 rounded-box w-52 p-2 shadow-2xl mt-2 border border-base-300">
                    <li><button data-set-theme="hackerfeed-dark" data-act-class="active">Hackerfeed Dark</button></li>
                    <li><button data-set-theme="hackerfeed-light" data-act-class="active">Hackerfeed Light</button></li>
                    <li><button data-set-theme="gruvbox" data-act-class="active">Gruvbox</button></li>
                    <li><button data-set-theme="onedark" data-act-class="active">One Dark</button></li>
                    <li><button data-set-theme="monokai" data-act-class="active">Monokai</button></li>  
                    <li><button data-set-theme="solarized" data-act-class="active">Solarized Dark</button></li>  
                    <li><button data-set-theme="pitchdark" data-act-class="active">Pitch Dark</button></li>
                    <li><button data-set-theme="cupcake" data-act-class="active">Cupcake</button></li>
                    <li><button data-set-theme="emerald" data-act-class="active">Emerald</button></li>
                    <li><button data-set-theme="corporate" data-act-class="active">Corporate</button></li>
                    <li><button data-set-theme="retro" data-act-class="active">Retro</button></li>
                    <li><button data-set-theme="cyberpunk" data-act-class="active">Cyberpunk</button></li>
                    <li><button data-set-theme="synthwave" data-act-class="active">Synthwave</button></li>
                    <li><button data-set-theme="forest" data-act-class="active">Forest</button></li>
                    <li><button data-set-theme="black" data-act-class="active">Black</button></li>
                    <li><button data-set-theme="dracula" data-act-class="active">Dracula</button></li>
                    <li><button data-set-theme="caramellatte" data-act-class="active">Caramel Latte</button></li>
                    <li><button data-set-theme="abyss" data-act-class="active">Abyss</button></li>
                    <li><button data-set-theme="silk" data-act-class="active">Silk</button></li>
                    <li><button data-set-theme="hotdog" data-act-class="active">Hotdog</button></li>
                    <li><button data-set-theme="blackpink" data-act-class="active">Blackpink</button></li>
                    <li><button data-set-theme="love" data-act-class="active">Love ❤️</button></li>
                </ul>
            </div>
        </div>
        <button class="btn btn-ghost btn-circle" onclick="settings.showModal()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
            </svg>
        </button>
        
        <dialog id="settings" class="modal modal-bottom sm:modal-middle">
            <div class="modal-box">
                <h3 class="font-bold text-lg mb-6">Settings</h3>
                <label class="label">
                    <span class="label-text font-medium">Font</span>
                </label>
                <select class="select select-ghost" id="fontSelect">
                    <option disabled selected>Pick a font</option>
                    <option>Inter</option>
                    <option>Poppins</option>
                    <option>EB Garamond</option>
                    <option>IBM Plex Sans</option>
                    <option>JetBrains Mono</option>
                    <option>Montserrat</option>
                    <option>Newsreader</option>
                    <option>Roboto</option>
                </select>

                <div class="form-control w-full">
                    <label class="label">
                        <span class="label-text font-medium">Stories refresh interval</span>
                    </label>
                    <label class="input-group">
                        <input type="number" 
                               min="0" 
                               class="input input-bordered w-half" 
                               id="fetchTimeInput" 
                               placeholder="Current: 15"/>
                        <span>minutes</span>
                    </label>
                    <label class="label">
                        <span class="label-text-alt">How often Hackerfeed will fetch new stories (default: 15)</span>
                    </label>
                </div>
        
                <div class="modal-action">
                    <form method="dialog" class="flex gap-2">
                        <button class="btn">Cancel</button>
                        <button class="btn btn-success" id="SaveBtn" onclick="Save()">Save changes</button>
                    </form>
                </div>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
        </dialog>
    </nav>

    <main class="flex flex-col items-center flex-grow space-y-12 py-16">
        <h1 class="text-6xl md:text-8xl font-bold text-primary drop-shadow-md">hackerfeed</h1>

        <form id="searchForm" class="w-full max-w-2xl px-4">
            <label class="input input-bordered border-base-300 flex items-center gap-3 h-14 text-lg w-full">
                <svg class="h-7 w-7 opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                    </g>
                </svg>
                <input type="search" id="searchInput" placeholder="Search with default engine" class="text-lg w-full" />
            </label>
        </form>

        <div id="topSites" class="max-w-[90rem] mx-auto grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-6 px-4 sm:px-6 lg:px-8">
        </div>

        <div id="stories" class="max-w-[90rem] mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 px-4 sm:px-6 lg:px-8">
        </div>
    </main>

    <footer class="bg-base-200 text-base-content text-center py-6 mt-10">
        <p>Hackerfeed is made by <a href="https://hei-lima.tech" class="text-primary hover:underline">Heitor Lima</a> and powered by Hacker News.  
            Want to <a href="https://github.com/Hei-Lima/hackerfeed" class="text-primary hover:underline">contribute</a>?</p>
    </footer>

    <script src="page/js/settings.js"></script>
    <script src="page/js/scripts.js"></script>
    <script src="page/js/topSites.js"></script>

</body>

</html>
